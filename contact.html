  <script type="text/babel">
    const faqs = [
      { q: "შემიძლია გაცნობოთ კონკრეტული მოდელის შესახებ?", a: "კი — დაგვიკავშირდით ელფოსტით და მიგვითითეთ მოდელის სახელი. პასუხს ჩვეულებრივ 1–2 დღეში ვაგზავნით." },
      { q: "მონტაჟს თქვენ ახორციელებთ?", a: "არა — ჩვენ ვართ საინფორმაციო რესურსი. მონტაჟისთვის გირჩევთ მეგატექნიკას, რომელიც გვაქვს გადამოწმებული. სხვა გადამოწმებული მონტიორების ჩამონათვალი მოცემულია ცალკეულ გზამკვლევებში." },
      { q: "ვინიცა PR-ი ან რეკლამა?", a: "ბრენდებთან PR-კომუნიკაცია — info@kondicionerebi.ge. ჩვენ არ ვწერთ ფასიან მიმოხილვებს და არ ვცვლით რეიტინგებს — გადახდის ფორმა მხოლოდ აფილირებული ბმულებია, რომელიც ცხადად აღნიშნულია." },
      { q: "შემიძლია გავაგზავნო პრობლემის სცენარი თქვენი ანალიზისთვის?", a: "კი — გადაგვიგზავნეთ ფოტო, მოდელის სახელი და მოკლე აღწერა info@kondicionerebi.ge-ზე. ხშირი პრობლემები მოგვიანებით სტატიაში გადადის (ანონიმურად)." },
    ];

    const App = () => (
      <>
        <Nav active="კონტაქტი"/>

        <header className="kg-hub-header">
          <div className="kg-page-inner">
            <nav className="kg-crumb" aria-label="breadcrumb">
              <a href="index.html">მთავარი</a>
              <span className="kg-crumb-sep">›</span>
              <span>კონტაქტი</span>
            </nav>
            <h1>კონტაქტი</h1>
            <p>კითხვები, შენიშვნები, თანამშრომლობა — დაგვიკავშირდით. პასუხს ჩვეულებრივ 1–2 დღეში ვაგზავნით.</p>
          </div>
        </header>

        <main className="kg-article">
          <section style={{ paddingTop: 32 }}>
            <div className="kg-contact-grid">
              <div className="kg-contact-card">
                <h3>ელფოსტა</h3>
                <p>ზოგადი კითხვები, შენიშვნები, თანამშრომლობა.</p>
                <a href="mailto:info@kondicionerebi.ge" className="latin">info@kondicionerebi.ge</a>
              </div>

              <div className="kg-contact-card">
                <h3>სოციალური ქსელები</h3>
                <p>ყოველდღიური განახლებები, ფოტო-ანგარიშები ბინების ტესტებიდან.</p>
                <p className="latin">
                  <a href="#">Facebook</a> · <a href="#">Instagram</a> · <a href="#">YouTube</a>
                </p>
              </div>

              <div className="kg-contact-card">
                <h3>მისამართი</h3>
                <p>თბილისი, საქართველო. ფიზიკური ოფისი არ გვაქვს — ვმუშაობთ დისტანციურად. შეხვედრები წინასწარი შეთანხმებით.</p>
              </div>

              <div className="kg-contact-card">
                <h3>პრესა და თანამშრომლობა</h3>
                <p>ბრენდებთან კომუნიკაცია, ექსპერტული ციტირება, ერთობლივი პროექტები.</p>
                <a href="mailto:press@kondicionerebi.ge" className="latin">press@kondicionerebi.ge</a>
              </div>
            </div>
          </section>

          <section style={{ paddingTop: 48, paddingBottom: 64 }}>
            <FAQ items={faqs}/>
          </section>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
