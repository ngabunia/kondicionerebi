<!doctype html>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>

  <script type="text/babel" src="TLDR.jsx"></script>
  <script type="text/babel" src="ComparisonTable.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="Author.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const tldr = [
      { label: "ფორმულა", text: 'სიმძლავრე (კვტ) × საათები × <span class="latin">0.30</span> ლარი = თვის ხარჯი' },
      { label: "მცირე ბინა", text: '<span class="latin">9000</span> BTU, <span class="latin">6</span> სთ/დღე — თვეში <span class="latin">45-60</span> ლარი' },
      { label: "Inverter-ის ეკონომია", text: '<span class="latin">30%</span>-ით ნაკლები — თვეში <span class="latin">15-20</span> ლარი' },
      { label: "A+++ კლასის ეკონომია", text: 'A+ კლასთან შედარებით — დამატებითი <span class="latin">10-15%</span>' },
    ];

    const tableHeaders = ["სცენარი", "ენერგო (კვტ/თვე)", "ლარი/თვე", "ლარი/სეზონი (4 თვე)"];
    const tableRows = [
      { href: "#", cells: [{ v: "9000 BTU, 4 სთ/დღე, A+" }, { v: "108 კვტ" }, { v: "32 ლარი" }, { v: "128 ლარი" }] },
      { href: "#", cells: [{ v: "9000 BTU, 6 სთ/დღე, A++" }, { v: "135 კვტ" }, { v: "40 ლარი" }, { v: "162 ლარი" }] },
      { href: "#", cells: [{ v: "12000 BTU, 6 სთ/დღე, A++" }, { v: "180 კვტ" }, { v: "54 ლარი" }, { v: "216 ლარი" }] },
      { href: "#", cells: [{ v: "18000 BTU, 8 სთ/დღე, A+++" }, { v: "270 კვტ" }, { v: "81 ლარი" }, { v: "324 ლარი" }] },
    ];

    const faqs = [
      { q: "ეს რეალური მონაცემებია?",
        a: "კი — დაყრდნობილია 2026 წლის ენერგო-ტარიფზე (0.30 ლარი/კვტ/სთ) და ჩვენი ტესტ-ბინების მონაცემებზე. რეალური ხარჯი მოხმარების ჩვევებზეა დამოკიდებული: ცხელ დღეებში მეტი, საღამოს კი ხშირად ნაკლები მუშაობა საკმარისია." },
      { q: "ფანჯრის გაღება ეკონომიურია?",
        a: "მხოლოდ ღამის ცივ საათებში (2:00-6:00). დღის ცხელ პერიოდში ფანჯრის გაღება მხოლოდ აძვირებს კონდიციონერის მუშაობას." },
      { q: "თერმოსტატის რა ტემპერატურა ვარჩიო?",
        a: "ყოველი 1 გრადუსით უფრო ცივი დაყენება 6-8%-ით ზრდის ხარჯს. რეკომენდირებული ტემპერატურა — დღისით 24-26°C, ღამით 22-24°C." },
      { q: "ფილტრის გაწმენდა ეხმარება?",
        a: "კი — დაბინძურებული ფილტრი ენერგო-ხარჯს 5-15%-ით ზრდის. გასუფთავება თვეში ერთხელ — 5 წუთიანი სამუშაოა, რომელიც ხელშესახებად ზოგავს ფულს." },
    ];

    const App = () => (
      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "თვის ხარჯი" },
              ]}
              title="რამდენი ღირს კონდიციონერი თვეში?"
              dek="რეალური დენის გადასახადის გათვლა საქართველოში. ფორმულა, სცენარები, რჩევები — როგორ შეამციროთ ხარჯი ცხელ ზაფხულში."

              updated="28 მარტი 2026"
              readTime="6 წუთის წასაკითხი"
              heroImg="images/photos/energy-meter.jpg"

            />

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>ფორმულა</h2>
              <p>კონდიციონერის თვის ხარჯი იანგარიშება მარტივად:</p>
              <p style={{ background: "var(--color-accent-soft)", padding: "16px 20px", borderRadius: 8, fontSize: 17 }}>
                <b>სიმძლავრე (კვტ) × საათები დღეში × დღეები თვეში × ფასი/კვტ</b>
              </p>
              <p>საქართველოში 2026 წლის ენერგო-ტარიფი — 0.30 ლარი/კვტ/სთ ჩვეულებრივი მოხმარების ფარგლებში (300 კვტ-მდე). ზემოთ — 0.34 ლარი/კვტ/სთ.</p>
              <p>9000 BTU კონდიციონერი — დაახლოებით 0.8-1.0 კვტ ენერგო-მოხმარება. დღეში 6 საათი — 5.4 კვტ. თვეში 30 დღე — 162 კვტ × 0.30 = <b>49 ლარი</b>.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>რეალური სცენარები</h2>
              <ComparisonTable headers={tableHeaders} rows={tableRows}/>
              <p style={{ marginTop: 16, fontSize: 14, color: "var(--color-text-muted)" }}>* დაყრდნობილია 2026 წლის ენერგო-ტარიფზე და ჩვენი ტესტ-ბინების მონაცემებზე. რეალური ხარჯი მოხმარების ჩვევებზე იცვლება.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როგორ შევამციროთ ხარჯი</h2>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>თერმოსტატი 24°C-ზე.</b> 22°C-დან 24°C-ზე გადასვლა — 12-16%-ით ნაკლები ხარჯი.</li>
                <li><b>Inverter მოდელი.</b> ჩვეულებრივ On/Off-თან შედარებით 30%-ით ნაკლები ენერგო-ხარჯი.</li>
                <li><b>A++ ან A+++ ენერგო-კლასი.</b> A+ მოდელებზე 10-20%-ით ნაკლები მოხმარება.</li>
                <li><b>ფილტრის გასუფთავება.</b> თვეში ერთხელ — 5-15%-ით უმჯობესდება ენერგო-ეფექტიანობა.</li>
                <li><b>ჩრდილოვანი ფასადი.</b> სამხრეთის ფანჯრებზე ჟალუზი ან ფარდა ცხელ საათებში — კონდიციონერის სამუშაო 10-20%-ით მცირდება.</li>
                <li><b>ფანჯრის გაღება ღამით.</b> ცივი დილის ღამეებში ფანჯრის გაღება ბუნებრივად აგრილებს ბინას — დღის ცხელ პერიოდში კონდიციონერი ნაკლები ხარჯით უმკლავდება.</li>
              </ul>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>გათბობა (ზამთრის გათვალისწინებით)</h2>
              <p>თუ კონდიციონერი გათბობისთვისაც გამოიყენება, ენერგო-ხარჯი იცვლება. Inverter მოდელი 0°C-მდე ენერგო-ეფექტიანია (COP 3-4) — ანუ 1 კვტ ენერგო-მოხმარებაზე 3-4 კვტ სითბოს გასცემს. ეს უფრო ეკონომიურია, ვიდრე ელექტრო-გამათბობელი ან გაზის ღუმელი.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="სკ"
                name="სოფო კუპრაშვილი"
                role="ჟურნალისტი · 4 წლის გამოცდილება ბრენდ-ანალიზში"
                bio="ვიკვლევ ბრენდებსა და ბაზრის ტენდენციებს. ვწერ შედარებებსა და ბრენდ-მიმოხილვებს, რომელიც ემყარება რეალურ ფასებსა და მკითხველის გამოცდილებას."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
