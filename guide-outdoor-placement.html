  <script type="text/babel">
    const tldr = [
      { label: "საუკეთესო", text: 'ჩრდილოეთის ან აღმოსავლეთის ფასადი — ნაკლები მზე, უკეთესი ეფექტურობა' },
      { label: "ცუდი", text: 'სამხრეთის ფასადი პირდაპირ მზის ქვეშ — <span class="latin">10-15%</span> ენერგო ხარჯი ცხელ დღეებში' },
      { label: "ჰაერი", text: 'მინიმუმ <span class="latin">30</span> სმ თავისუფალი სივრცე გარშემო — ცხელი ჰაერი უნდა გასცდეს' },

      { q: "ცხელი ჰაერი მეზობელს დაუშავებს?",
        a: "თუ მეზობლის ფანჯარა 1-2 მ-ში — დიახ, შესაძლოა. ცხელი ჰაერი 8-12°C უფრო თბილია გარემოს ჰაერთან. ეტიკეტური წესი — გარე ბლოკი მიმართეთ ისე, რომ მეზობლის ფანჯრიდან 3+ მ-ზე და გვერდით." },
      { q: "მთის სახლი — გარე ბლოკი ღია სივრცეში?",
        a: "ჯობია სახურავი ან ჩრდილოვანი ადგილი. პირდაპირი მზე, წვიმა და თოვლი ამცირებს მოწყობილობის ვადას 2-3 წლით." },
    ];

    const App = () => (
      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },

              dek="სამხრეთ ფასადი vs ჩრდილოეთი — სხვაობა იგრძნობა ცხელ დღეებში. გავიგოთ, რა ცვლის გარე ბლოკის ადგილი."

              authorName="სოფო კუპრაშვილი"
              authorRole="ჟურნალისტი · ბრენდ-ანალიზი"
              updated="7 მარტი 2026"
              readTime="5 წუთის წასაკითხი"
              heroCaption="გარე ბლოკი ჩრდილოეთის ფასადზე — საუკეთესო ვარიანტი ენერგო-ეფექტურობით."

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>

              <p>გარე ბლოკი (კონდენსატორი) გადააქცევს ცხელ ფრიონს თხევად — ეს არის გრილების სისტემის ყველაზე გაოფლიანი ეტაპი. რაც უფრო ცივი გარეთა ჰაერი, რომელშიც გარე ბლოკი მუშაობს, მით ეფექტური სისტემაა.</p>
              <p>თუ გარე ბლოკი დგას პირდაპირი მზის ქვეშ, ცხელ თბილისურ ზაფხულში მისი ფიზიკური გარემოს ტემპერატურა შეიძლება 45-50°C იყოს. ჩრდილოვან ადგილზე — 35-38°C. სხვაობა 10°C — ენერგო-ეფექტურობის 10-15%-იანი დანაკარგი.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>საუკეთესო ადგილები</h2>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>ჩრდილოეთის ფასადი.</b> არც პირდაპირი მზე, არც ცხელი ფასადი.</li>
                <li><b>აღმოსავლეთის ფასადი.</b> მხოლოდ დილის მზე — ცხელი დღის საათებში ჩრდილში.</li>
                <li><b>ჩრდილოვანი ბალკონი.</b> თუ ბალკონი ღიაა და ხაზის ფასადზე ჩრდილია.</li>
                <li><b>სახურავი (კერძო სახლი).</b> ფართო სივრცე, ცხელი ჰაერი თავისუფლად მიდის. ფასადის რესტავრაცია არ საჭიროებს.</li>
              </ul>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>ცუდი ადგილები</h2>

                <li><b>დახურული ნიში.</b> ცხელი ჰაერი არ გასცდება, რეცირკულაცია — გადახურდება.</li>
                <li><b>დახურული ბალკონი.</b> ცხელი ჰაერი დარჩება ბალკონის ფარგლებში — სისტემა იხურება.</li>
                <li><b>მიწის დონეზე ბაღში.</b> ბრუნავი ფოთლები, მტვერი — ფილტრები სწრაფად ეცემიან.</li>
              </ul>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>ფიზიკური მოთხოვნები</h2>
              <p>გარშემო თავისუფალი სივრცე:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>წინ (ცხელი ჰაერი გადის) — მინიმუმ 50 სმ</li>
                <li>გვერდით — მინიმუმ 20 სმ</li>
                <li>ზემოთ — მინიმუმ 30 სმ</li>
                <li>უკან (ცივი ჰაერი მოდის) — მინიმუმ 10 სმ</li>
              </ul>
              <p>თუ ეს მინიმუმები არ შესრულდა — ცხელი ჰაერი დაბრუნდება გარე ბლოკში, რეცირკულაცია გადახურდება სისტემას.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>ვიბრაცია და ხმაური</h2>
              <p>გარე ბლოკი მუშაობს 45-55 dB დონეზე (1 მეტრის მანძილზე). ეს არ არის ცუდი თქვენთვის — ცხელი ჰაერი იცავს ხმაურს — მაგრამ შეიძლება პრობლემა იყოს ქვედა ან გვერდითი მცხოვრებლისთვის. რეკომენდირებული პრაქტიკები:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>ანტი-ვიბრაციული რეზინი მონტაჟის სამაგრებზე</li>
                <li>3+ მეტრის მანძილი მეზობლის ფანჯრიდან</li>
                <li>გავიდრე ცხელი ჰაერი არ მიმართულია მეზობლის ბალკონზე</li>
              </ul>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>

            <div style={{ marginTop: 64 }}>

                initials="სკ"
                name="სოფო კუპრაშვილი"
                role="ჟურნალისტი · 4 წლის გამოცდილება ბრენდ-ანალიზში"
                bio="ვიკვლევ ბრენდებსა და ბაზრის ტენდენციებს. ვწერ შედარებებსა და ბრენდ-მიმოხილვებს, რომელიც ემყარება რეალურ ფასებსა და მკითხველის გამოცდილებას."
              />
