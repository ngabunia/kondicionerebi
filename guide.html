                  oldPrice="899"
                  ctaLabel="ნახე მეგატექნიკაში"
                  ctaHref="#"

                name="ნიკა ჯავახიშვილი"
                role="მთავარი რედაქტორი · 6 წლის გამოცდილება კონდიციონერების ანალიზში"
                bio="ვტესტავ კონდიციონერებს რეალურ ბინებში თბილისში. წინა სამსახური — Megatechnica-ს ტექნიკური მრჩეველი HVAC მიმართულებით. ვცდილობ, რომ ყოველი რეკომენდაცია იყოს გამოცდილების შედეგი, არა მარკეტინგული მასალის გადათარგმნა."
              />

              <RelatedGrid items={relatedItems}/>

            <Sidebar tocItems={tocItems} active="pick"/>

        </main>

        <Footer/>
