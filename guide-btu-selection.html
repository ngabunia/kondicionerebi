    ];

    const faqs = [
      { q: "რა BTU მჭირდება 20 კვ.მ ოთახისთვის?",

      { q: "შესაძლოა კონდიციონერი ზედმეტად მძლავრი იყოს?",

            <section style={{ paddingTop: 48 }}>
              <h2>ბაზისური ფორმულა</h2>
              <p>კონდიციონერის სიმძლავრე იზომება BTU-ში (British Thermal Unit). ზოგადი წესით, 1 კვადრატულ მეტრს <b>350 BTU</b> სჭირდება სტანდარტული პირობებისთვის — 2.7 მ ჭერი, კარგი იზოლაცია, ჩრდილოეთის ფასადი.</p>
              <p>ანუ: <b>25 კვ.მ ოთახი × 350 BTU = 8 750 BTU</b>. ბაზრის სტანდარტული მოდელია 9 000 BTU — ე.წ. „ცხრიანი“.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როდის უნდა გავზარდოთ</h2>
              <p>სამი ფაქტორი ცვლის ფორმულას:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>ჭერი 3 მ-ზე მაღალია</b> — დაამატეთ 10%. 3.5 მ-ის შემთხვევაში — 30%.</li>
                <li><b>სამხრეთის ან დასავლეთის ფასადი</b> — დაამატეთ 15%. პირდაპირი მზე თბილისის ცხელ ზაფხულში მნიშვნელოვნად ცვლის სითბურ დატვირთვას.</li>

                <li>ხანმოკლე ციკლების ხშირი მონაცვლეობა აჩქარებს კომპრესორის ცვეთას.</li>
                <li>ჰაერი ვერ ისპობა ტენისგან — მუშაობის დრო ძალიან მცირეა.</li>
                <li>ენერგო-მოხმარება სწორად შერჩეულ მოდელზე უფრო მაღალია.</li>
              </ul>
            </section>

            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio

                name="ნიკა ჯავახიშვილი"
                role="მთავარი რედაქტორი · 6 წლის გამოცდილება კონდიციონერების ანალიზში"
                bio="ვტესტავ კონდიციონერებს რეალურ ბინებში თბილისში. ვცდილობ, რომ ყოველი რეკომენდაცია იყოს გამოცდილების შედეგი, არა მარკეტინგული მასალის გადათარგმნა."
              />
            </div>
          </div>
