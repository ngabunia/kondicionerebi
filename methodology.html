  <script type="text/babel">
    const App = () => (
      <>
        <Nav/>

        <header className="kg-hub-header">
          <div className="kg-page-inner">
            <nav className="kg-crumb" aria-label="breadcrumb">
              <a href="index.html">მთავარი</a>
              <span className="kg-crumb-sep">›</span>
              <span>მეთოდოლოგია</span>
            </nav>
            <h1>მეთოდოლოგია</h1>
            <p>როგორ ვცდით კონდიციონერებს — და რატომ ვენდობით რეალურ ბინებს უფრო მეტად, ვიდრე ლაბორატორიის მონაცემებს.</p>
          </div>
        </header>

        <main className="kg-article">
          <section style={{ paddingTop: 48 }}>
            <h2>რატომ არ ვენდობით ლაბორატორიის მონაცემებს</h2>
            <p>მწარმოებლის სპეციფიკაცია ბევრ რამეს გვეუბნება — BTU, ენერგოკლასი, ხმაური. მაგრამ ეს რიცხვები იდეალურ პირობებში იზომება: გარეთ 27°C, შიგნით 24°C, კარგი იზოლაცია, ახალი ფილტრი. თბილისის ზაფხული კი სხვა ამბავია — გარეთ 40°C, გავარვარებული ბეტონის ფასადი, სამმეტრიანი ჭერი. ამას ვერცერთი ლაბორატორია ვერ გაითამაშებს.</p>
            <p>ამიტომ კონდიციონერებს ნამდვილ ბინებში, ნამდვილ მაცხოვრებლებთან ვცდით. ეს ერთადერთი გზაა იმის გასაგებად, როგორ იმუშავებს ტექნიკა სწორედ იმ პირობებში, რომლისთვისაც მას ყიდულობთ.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>ჩვენი სატესტო ბინები</h2>
            <p>ყოველ წელს თბილისში ოთხ ბინას ვარჩევთ ისე, რომ ქალაქის სხვადასხვა მიკროკლიმატი მოვიცვათ:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>ვაკე</b> — ძველი კორპუსი, 60 კვ.მ, ფანჯრები ჩრდილოეთისკენ, კარგი იზოლაცია.</li>
              <li><b>საბურთალო</b> — ახალაშენებული სახლი, 45 კვ.მ, სამხრეთის მხარე, დიდი ფანჯრები — ცხელი ოთახი.</li>
              <li><b>დიდუბე</b> — საბჭოთა სერია, 35 კვ.მ, სუსტი იზოლაცია, ზომიერი მზე.</li>
              <li><b>ისანი</b> — სტუდიო, 28 კვ.მ, აღმოსავლეთის მხარე, 2.5 მ ჭერი.</li>
            </ul>
            <p>მაცხოვრებლები კონდიციონერს ჩვეულებრივად იყენებენ — დილით, საღამოს, ღამით. ჩვენ მხოლოდ მონაცემებს ვაგროვებთ.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>რას ვზომავთ</h2>
            <p>თითო მოდელზე მონაცემებს მთელი ზაფხულის განმავლობაში ვაგროვებთ (მაისი–სექტემბერი):</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>რეალური სიმძლავრე</b> — რამდენ ხანში აგრილებს ოთახს 30°C-დან 24°C-მდე ყველაზე ცხელ დღეებში.</li>
              <li><b>დენის ხარჯი</b> — ციფრული მრიცხველით და არა მწარმოებლის ეტიკეტით; შედეგს მეპატრონის რეალურ ქვითარსაც ვუდარებთ.</li>
              <li><b>ხმაური</b> — ხმაურმზომით, 1 და 3 მეტრის მანძილიდან, დღისა და ღამის რეჟიმში.</li>
              <li><b>მონტაჟი</b> — სირთულე, დრო, ფასი, საჭირო ნებართვები.</li>
              <li><b>საგარანტიო სერვისი</b> — პრობლემის შემთხვევაში რამდენ ხანში პასუხობს სერვისცენტრი და როგორ აგვარებს.</li>
              <li><b>გრძელვადიანი საიმედოობა</b> — წინა წლების მოდელების ისტორია და ფილტრების შეცვლის ხარჯი.</li>
            </ul>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>ჩვენი აღჭურვილობა</h2>
            <p>ვცდილობთ, ყველა ციფრი გადამოწმებადი იყოს. ვიყენებთ:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><span className="latin">Testo 405i</span> — ჰაერის ნაკადისა და ტემპერატურის ციფრული თერმოანემომეტრი.</li>
              <li><span className="latin">UNI-T UT353</span> — ხმაურმზომი, ±1.5 dB სიზუსტით.</li>
              <li><span className="latin">Sonoff POW R2</span> — დენის მრიცხველი; მინიმალურ, მაქსიმალურ და საშუალო მოხმარებას იწერს.</li>
              <li>ციფრული ჰიგრომეტრი — ტენიანობის გასაზომად.</li>
            </ul>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>როგორ ვადგენთ რეიტინგს</h2>
            <p>კონდიციონერი ერთგანზომილებიანი პროდუქტი არ არის — „საუკეთესო“ იმაზეა დამოკიდებული, კონკრეტულად რა გჭირდებათ. ამიტომ ერთიანი №1-ის ნაცვლად კატეგორიების მიხედვით ვაჯილდოებთ:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>ჩვენი ფავორიტი</b> — ფასისა და ხარისხის საუკეთესო ბალანსი საშუალო ბინისთვის.</li>
              <li><b>ბიუჯეტური არჩევანი</b> — ყველაზე იაფი ვარიანტი, რომლის რეკომენდაციაც ჯერ კიდევ გვეთქმის.</li>
              <li><b>პრემიუმკლასი</b> — ენერგოეფექტური ან განსაკუთრებით ჩუმი; ფასი მეორეხარისხოვანია.</li>
              <li><b>დიდი სივრცისთვის</b> — 40+ კვ.მ და ღია გეგმარების ბინებისთვის.</li>
            </ul>
            <p>თუ მოდელი ვერცერთ კატეგორიაში ვერ ლიდერობს, მასზე რეკომენდაციას საერთოდ არ ვწერთ — უბრალოდ „კარგი“ საკმარისი არ არის.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>როდის ვაახლებთ</h2>
            <p>გზამკვლევებს ყოველი წლის გაზაფხულზე ვაახლებთ — ახალი მოდელების გამოსვლისა და წინა წლის გამოცდილების ანალიზის შემდეგ. განახლების თარიღი ყველა სტატიას თავში უწერია.</p>
            <p>თუ მწარმოებელი მოდელს წარმოებიდან ხსნის ან სერიოზული პრობლემა ვლინდება, სტატიას შენიშვნას ვუმატებთ ან რეკომენდაციას მთლიანად ვცვლით.</p>
          </section>

          <section style={{ paddingTop: 32, paddingBottom: 64 }}>
            <h2>კითხვები</h2>
            <p>თუ ჩვენს მეთოდოლოგიაზე შენიშვნა გაქვთ ან ფიქრობთ, რომ რომელიმე ტესტი მცდარად ჩავატარეთ, მოგვწერეთ: <a href="mailto:info@kondicionerebi.ge">info@kondicionerebi.ge</a>. შეცდომები ყველას მოსდის — და მათ აღმოჩენაში მკითხველების შენიშვნები ყველაზე მეტად გვეხმარება.</p>
          </section>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
