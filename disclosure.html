  <script type="text/babel">
    const App = () => (
      <>
        <Nav/>

        <header className="kg-hub-header">
          <div className="kg-page-inner">
            <nav className="kg-crumb" aria-label="breadcrumb">
              <a href="index.html">მთავარი</a>
              <span className="kg-crumb-sep">›</span>
              <span>გამჭვირვალობა</span>
            </nav>
            <h1>გამჭვირვალობა</h1>
            <p>როგორ გამოვიმუშავებთ, მოქმედებს თუ არა ეს ჩვენს რჩევებზე — და რას ვაკეთებთ, რომ რეკომენდაციები დამოუკიდებელი დარჩეს.</p>
          </div>
        </header>

        <main className="kg-article">
          <section style={{ paddingTop: 48 }}>
            <h2>დამოუკიდებლობა</h2>
            <p>kondicionerebi.ge დამოუკიდებელი საინფორმაციო რესურსია. არც რომელიმე ბრენდის ოფიციალური დილერი ვართ, არც მაღაზიის შვილობილი კომპანია — და „საუკეთესოს“ ტიტულს ფულით ვერავინ იყიდის.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>როგორ გამოვიმუშავებთ</h2>
            <p>ჩვენი ძირითადი შემოსავალი <b>პარტნიორული ბმულებია</b>: როცა მკითხველი ჩვენი სტატიიდან გამყიდველის გვერდზე გადადის და პროდუქტს ყიდულობს, გამყიდველისგან მცირე საკომისიოს ვიღებთ. თქვენთვის ფასი არ იცვლება — საკომისიო გამყიდველის მარჟიდან იხდება და არა თქვენი ჯიბიდან.</p>
            <p>პარტნიორული ბმულები სტატიის ბოლოს არის აღნიშნული. ხშირად ალტერნატივებსაც ვუთითებთ (Extra.ge, ee.ge) — მათ შორის არაპარტნიორულებსაც, თუ სადმე უკეთესი ფასი დაგვხვდა.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>ჩვენი პარტნიორი მაღაზია</h2>
            <p>დღეს ჩვენი მთავარი რეკომენდებული მაღაზია <b>მეგატექნიკაა</b> — Hisense-ის, AUX-ის, LG-სა და Samsung-ის <b>ოფიციალური დისტრიბუტორი საქართველოში</b>. პრაქტიკაში ეს ასე ითარგმნება:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>ყველაზე დაბალი ფასები.</b> ტექნიკა პირდაპირ დისტრიბუტორისგან მოდის, შუამავლების მარჟის გარეშე — ფასი ხშირად 5–15%-ით დაბალია, ვიდრე სხვაგან.</li>
              <li><b>საუკეთესო საგარანტიო პირობები.</b> სრული ქარხნული გარანტია (Hisense — 3 წელი, Samsung — 3 წელი, LG — 10 წელი კომპრესორზე, AUX — 2 წელი) და ოფიციალური სერვისცენტრის მხარდაჭერა.</li>
              <li><b>პროფესიული სერვისი.</b> სერტიფიცირებული ტექნიკოსები, ტექნიკური მხარდაჭერა, სათადარიგო ნაწილების სრული მარაგი.</li>
              <li><b>უფასო მიწოდება და მაღაზიები მთელ საქართველოში.</b> ფიზიკური მაღაზიები თბილისში, ბათუმსა და ქუთაისში — ან ონლაინ შეკვეთა <a href="https://megatechnica.ge" target="_blank" rel="noopener">megatechnica.ge</a>-ზე, სახლამდე უფასო მიტანით.</li>
            </ul>
            <p>გულახდილად ვამბობთ: მეგატექნიკასთან პარტნიორული ხელშეკრულება გვაქვს — მისი ბმულით შეძენისას მცირე საკომისიოს ვიღებთ. მაგრამ მეგატექნიკას ამის გამო კი არ ვირჩევთ, არამედ იმიტომ, რომ ის ამ ოთხი ბრენდის ფაქტობრივად ერთადერთი ოფიციალური დისტრიბუტორია საქართველოში — და ტესტებშიც საუკეთესო პირობები სწორედ იქ დაგვხვდა.</p>
            <p>ფასების შესადარებლად ალტერნატივებსაც ვუთითებთ — <span className="latin">Extra.ge</span>, <span className="latin">ee.ge</span>, ფიზიკური მაღაზიები. ეს ბმულები, როგორც წესი, <b>არ არის</b> პარტნიორული.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>რას არ ვაკეთებთ</h2>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>ფასიან მიმოხილვებს არ ვწერთ.</b> დადებით შეფასებას ფულით ვერცერთი ბრენდი ვერ იყიდის — ასეთ შეთავაზებებზე უარს ვამბობთ.</li>
              <li><b>პარტნიორობა რეიტინგებს არ ცვლის.</b> მოდელი „საუკეთესო“ იმიტომ არ ხდება, რომ მისი ბმული ჩვენთვის მომგებიანია — რეიტინგი მხოლოდ ტესტების მონაცემებით დგება.</li>
              <li><b>სტატიებს პარტნიორობის გამო არ ვასწორებთ.</b> ტექსტი ჯერ იწერება; პარტნიორული ბმული მერე ემატება — შინაარსში ჩარევის გარეშე.</li>
              <li><b>არარსებულ ფასდაკლებებს არ ვაცხადებთ.</b> ფასებს ყოველი თვის ბოლოს ხელით ვამოწმებთ.</li>
            </ul>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>როცა უფასო ნიმუშებს ვიღებთ</h2>
            <p>ზოგჯერ ბრენდი მოწყობილობას საცდელად უფასოდ გვიგზავნის — ტექნიკურ ჟურნალისტიკაში ეს ჩვეულებრივი პრაქტიკაა. ასეთ დროს წესები ასეთია:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li>სტატიაში ღიად ვწერთ, რომ მოწყობილობა უფასოდ მივიღეთ.</li>
              <li>ბრენდი სტატიას გამოქვეყნებამდე ვერ ხედავს.</li>
              <li>გამოქვეყნების შემდეგ ცვლილებებს ვერ მოგვთხოვს.</li>
              <li>ტესტის ბოლოს მოწყობილობას ხშირად ვუბრუნებთ; თუ ვიტოვებთ, ამასაც ღიად ვწერთ.</li>
            </ul>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>კონფლიქტი ინტერესთა</h2>
            <p>ჩვენი გუნდის წევრებს შესაძლოა ჰქონდეთ წინა სამუშაო გამოცდილება HVAC ინდუსტრიის ბრენდებთან ან გამყიდველებთან. ეს ცხადია მითითებული ავტორის ბიოგრაფიაში.</p>
            <p>თუ რომელიმე გუნდის წევრს აქვს მიმდინარე კომერციული ინტერესი რომელიმე ბრენდთან — ის არ წერს იმ ბრენდის შესახებ. სტატიის ავტორი ცხადია მითითებული.</p>
          </section>

          <section style={{ paddingTop: 32, paddingBottom: 64 }}>
            <h2>კითხვები</h2>
            <p>თუ მიგაჩნიათ, რომ რომელიმე სტატია არ შეესაბამება ამ წესებს — გვაცნობეთ <a href="mailto:info@kondicionerebi.ge">info@kondicionerebi.ge</a>. ჩვენი რეპუტაცია ერთადერთი აქტივია, რომელიც გვაქვს — გვიხდება მისი დაცვა.</p>
          </section>
        </main>

        <Footer/>
      </>
    );
