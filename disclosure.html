  <script type="text/babel">
    const App = () => (
      <>
        <Nav/>

        <header className="kg-hub-header">
          <div className="kg-page-inner">
            <nav className="kg-crumb" aria-label="breadcrumb">
              <a href="index.html">მთავარი</a>
              <span className="kg-crumb-sep">›</span>
              <span>გამჭვირვალობა</span>
            </nav>
            <h1>გამჭვირვალობა</h1>
            <p>როგორ ვშოულობთ ფულს, რა გავლენას ახდენს ეს ჩვენი რჩევებზე — და რას ვაკეთებთ, რომ რჩევები იყოს დამოუკიდებელი.</p>
          </div>
        </header>

        <main className="kg-article">
          <section style={{ paddingTop: 48 }}>
            <h2>დამოუკიდებლობა</h2>
            <p>kondicionerebi.ge არის დამოუკიდებელი საინფორმაციო რესურსი. არ ვართ რომელიმე ბრენდის ოფიციალური დილერი, არ ვართ მაღაზიის შვილობილი კომპანია და არცერთი ბრენდი ვერ გვიხდის ფულს „საუკეთესოს“ ტიტულისთვის.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>როგორ ვშოულობთ ფულს</h2>
            <p>ჩვენი ძირითადი შემოსავალია <b>აფილირებული ბმულები</b> — ანუ, როცა მკითხველი ჩვენი სტატიიდან გადადის გამყიდველის გვერდზე და იყიდის პროდუქტს, ვიღებთ მცირე საკომისიოს გამყიდველისგან. ეს არ ცვლის თქვენთვის ფასს — საკომისიო გადახდილია გამყიდველის მარჟიდან, არა თქვენი ჯიბიდან.</p>
            <p>ბმულები, რომელიც აფილირებულია, აღნიშნულია სტატიის ბოლოს. ხშირად ჩვენ ვუთითებთ ალტერნატივებსაც (Extra.ge, ee.ge) — მათ შორის არააფილირებულებსაც, თუ ისინი უკეთეს ფასს გვთავაზობენ.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>ჩვენი პარტნიორი გამყიდველები</h2>
            <p>დღეს გვაქვს აფილირებული ურთიერთობა:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>მეგატექნიკა</b> — ჩვენი მთავარი რეკომენდირებული გამყიდველი. გვაქვს გადამოწმებული მათი ფასები, მონტაჟის ხარისხი და გარანტიის სამუშაო. ეს ურთიერთობა აფილირებულია.</li>
            </ul>
            <p>ჩვენ ვადარებთ ფასებს სხვა გამყიდველებთანაც — <span className="latin">Extra.ge</span>, <span className="latin">ee.ge</span>, ფიზიკური მაღაზიები — და ვუთითებთ მათ რეალურ ფასებს. ეს ბმულები ჩვეულებრივ <b>არ არის</b> აფილირებული — მათი მითითება გვაძლევს მკითხველს არჩევანის თავისუფლებას.</p>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>რას არ ვაკეთებთ</h2>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li><b>არ ვწერთ ფასიან მიმოხილვებს.</b> არცერთი ბრენდი ვერ გვიხდის ფულს დადებითი მიმოხილვისთვის. თუ რომელიმე ბრენდი მოგვმართავს ფასიანი სტატიის შეთავაზებით, უარს ვამბობთ.</li>
              <li><b>აფილაცია არ ცვლის რეიტინგებს.</b> საუკეთესო მოდელი არ ხდება მეგატექნიკის ფავორიტი იმიტომ, რომ ბმული ჩვენთვის უფრო „მომგებიანია“. რეიტინგი დგინდება ტესტ-მონაცემებიდან, ფასი — ბაზრის ფასს ეფუძნება.</li>
              <li><b>არ ვცვლით სტატიას აფილაციის შემდეგ.</b> თუ მოდელი დაიწერა ერთხელ — შემდეგ აფილირებული ბმული დაემატება სტატიის გადახედვის გარეშე.</li>
              <li><b>არ ვცხადებთ ფასდაკლებას, რომელიც არ არსებობს.</b> ფასები მოწმდება ხელით ყოველი თვის ბოლოს.</li>
            </ul>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>როცა ვიღებთ უფასო ნიმუშებს</h2>
            <p>ზოგჯერ ბრენდი გვაგზავნის მოწყობილობას ტესტისთვის უფასოდ. ეს ჩვეულებრივი პრაქტიკაა ტექნოლოგიის ჟურნალისტიკაში. რა ვაკეთებთ ამ შემთხვევაში:</p>
            <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
              <li>სტატიაში ცხადია მითითებული, რომ მოწყობილობა მივიღეთ უფასოდ.</li>
              <li>ბრენდს არ უხილავს სტატია გამოქვეყნებამდე.</li>
              <li>ბრენდი ვერ მოგვთხოვს ცვლილებებს გამოქვეყნების შემდეგ.</li>
              <li>ხშირად მოწყობილობას ვუბრუნებთ ბრენდს ტესტის შემდეგ. თუ ვინახავთ, ეს ცხადია.</li>
            </ul>
          </section>

          <section style={{ paddingTop: 32 }}>
            <h2>კონფლიქტი ინტერესთა</h2>
            <p>ჩვენი გუნდის წევრებს შესაძლოა ჰქონდეთ წინა სამუშაო გამოცდილება HVAC ინდუსტრიის ბრენდებთან ან გამყიდველებთან. ეს ცხადია მითითებული ავტორის ბიოგრაფიაში.</p>
            <p>თუ რომელიმე გუნდის წევრს აქვს მიმდინარე კომერციული ინტერესი რომელიმე ბრენდთან — ის არ წერს იმ ბრენდის შესახებ. სტატიის ავტორი ცხადია მითითებული.</p>
          </section>

          <section style={{ paddingTop: 32, paddingBottom: 64 }}>
            <h2>კითხვები</h2>
            <p>თუ მიგაჩნიათ, რომ რომელიმე სტატია არ შეესაბამება ამ წესებს — გვაცნობეთ <a href="mailto:info@kondicionerebi.ge">info@kondicionerebi.ge</a>. ჩვენი რეპუტაცია ერთადერთი აქტივია, რომელიც გვაქვს — გვიხდება მისი დაცვა.</p>
          </section>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
