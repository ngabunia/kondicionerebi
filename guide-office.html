<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>კონდიციონერი ოფისისთვის — kondicionerebi.ge</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="site2.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="ArticleHeader.jsx"></script>
  <script type="text/babel" src="TLDR.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="Author.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const tldr = [
      { label: "მუშაობის რეჟიმი", text: 'ოფისი — დღეში <span class="latin">8–10</span> საათი, ბინა — <span class="latin">2–4</span>. სხვაობა მნიშვნელოვანია.' },
      { label: "კომერციული მოდელი", text: 'გაძლიერებული კომპრესორი უწყვეტი მუშაობისთვის — <span class="latin">+30%</span> ფასი, <span class="latin">2×</span> სამსახურის ვადა' },
      { label: "ხმაური", text: 'ღია სამუშაო სივრცე — <span class="latin">25</span> dB ან ნაკლები' },
      { label: "მონტაჟი", text: 'შესაძლოა საჭირო გახდეს კომერციული ნებართვა (გარე ბლოკი ფასადზე)' },
    ];

    const faqs = [
      { q: "სტანდარტული მოდელი ოფისს გამოადგება?",
        a: "კი, თუ ოფისი მცირეა (4–6 ადამიანი, 30–40 კვ.მ) და სამუშაო რეჟიმი დღეში 8 საათს არ აჭარბებს. დიდი გუნდის ან 24/7 სერვერული ოთახისთვის — საჭიროა კომერციული მოდელი." },
      { q: "რა გარანტიას ვითხოვო?",
        a: "მთლიან მოწყობილობაზე 3 წელი, კომპრესორზე 5 წელი. კომერციული მოდელებისთვის ცალკე გარანტიის პოლისი — რომელიც ფარავს ბიზნეს-სამუშაო რეჟიმს." },
      { q: "სითბური ტუმბო (heat pump) გამოადგება?",
        a: "ოფისს ხშირად ერთდროულად ცივი ჰაერი ზაფხულში და თბილი ზამთარში სჭირდება. სითბური ტუმბო ორივე ფუნქციას ერთსავე მოწყობილობით ასრულებს — 0°C-მდე ენერგო-ეფექტიანია." },
    ];

    const App = () => (
      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "კონდიციონერი ოფისისთვის" },
              ]}
              title="კონდიციონერი ოფისისთვის — რა განასხვავებთ"
              dek="კომერციული მოხმარების სპეციფიკა, კომპრესორების ტიპები და როდის ჯობს კომერციული მოდელი ჩვეულებრივ ბინისთვის გაკეთებულზე."
              authorInitials="სკ"
              authorName="სოფო კუპრაშვილი"
              authorRole="ჟურნალისტი · ბრენდ-ანალიზი"
              updated="3 მაისი 2026"
              readTime="8 წუთის წასაკითხი"
              heroCaption="ღია სამუშაო სივრცე ვაკეში. ცივი ჰაერი, თანაბრად განაწილებული."
            />

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>რატომ არ გამოდგება „ბინის“ მოდელი</h2>
              <p>ჩვეულებრივი 9000 BTU კონდიციონერი დაპროექტებულია დღეში 2–4 საათიანი მუშაობისთვის. ოფისში კი მუშაობს დღეში 8–10 საათი, კვირაში 5 დღე, წელიწადში 6–8 თვე — 2–3-ჯერ მეტი დატვირთვა.</p>
              <p>შედეგი: კომპრესორის სამსახურის ვადა 5–7 წლიდან 3–4 წლამდე მცირდება, ფილტრები სწრაფად ცვდება, სერვისის გამოძახება ხშირდება. ფარული ხარჯი ხშირად ფასს 30%-ით ემატება სერვისის ხარჯზე.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>კომერციული მოდელის უპირატესობები</h2>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>გაძლიერებული კომპრესორი</b> — დაპროექტებულია უწყვეტი მუშაობისთვის.</li>
                <li><b>უკეთესი ფილტრაცია</b> — ოფისებში ხშირად საჭიროა HEPA ფილტრი ან ანტიბაქტერიული ფენა.</li>
                <li><b>გაფართოებული გარანტია</b> — 3–5 წელი, რომელიც ბიზნეს-მოხმარებას ფარავს.</li>
                <li><b>ჭკვიანი მართვა</b> — ცენტრალური მართვის სისტემა, რომელიც ოფისის ბილდინგ-სისტემაში ერთვება.</li>
              </ul>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როდის საკმარისია ჩვეულებრივი</h2>
              <p>თუ ოფისი ასეთია:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>4–6 ადამიანი, 30 კვ.მ-მდე ფართობით</li>
                <li>კონდიციონერი დღეში 6–7 საათი მუშაობს, არა 24/7</li>
                <li>ბიუჯეტი 1 500 ლარის ფარგლებშია</li>
              </ul>
              <p>— მაშინ ჩვეულებრივი მაღალი ხარისხის მოდელი (Hisense, Samsung, Daikin) საკმარისი იქნება. ფასისა და მუშაობის თანაფარდობა ნახევრად-კომერციულ მოდელზე უკეთესია.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>მონტაჟის თავისებურებები</h2>
              <p><b>კომერციული ფასადი.</b> დიდი ბიზნეს-ცენტრები ხშირად ითხოვს დამატებით ნებართვებს გარე ბლოკის მონტაჟისთვის. ჯერ კიდევ შესყიდვამდე შეათანხმეთ შენობის მართვის კომპანიასთან.</p>
              <p><b>ცენტრალური სისტემები (VRV/VRF).</b> დიდი ოფისებისთვის (200+ კვ.მ) ხშირად ერთიანი სისტემა ეფექტიანია რამდენიმე ცალკეულ მოწყობილობაზე. მონტაჟი 3–5-ჯერ ძვირია, თუმცა ენერგო-მოხმარება და სერვისის ხარჯი მცირდება.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="სკ"
                name="სოფო კუპრაშვილი"
                role="ჟურნალისტი · 4 წლის გამოცდილება ბრენდ-ანალიზში"
                bio="ვიკვლევ ბრენდებსა და ბაზრის ტენდენციებს. ვწერ შედარებებსა და ბრენდ-მიმოხილვებს, რომელიც ემყარება რეალურ ფასებსა და მკითხველის გამოცდილებას."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
