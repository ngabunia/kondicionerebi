        a: "კი — ვენტილატორი და კომპრესორი ხომ მუშაობს. ჩვეულებრივ ხმაური დღის რეჟიმში 19–30 dB-ის ფარგლებშია. საყურადღებო მაშინაა, როცა ხმა მკვეთრად მატულობს ან აქამდე გაუგონარი ბგერა ჩნდება." },

    const App = () => (

            />

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>ლითონის ხახუნი (მექანიკური)</h2>
              <p><b>როგორ ჟღერს:</b> მკვეთრი ლითონური ხმა, ვენტილატორის ბრუნვის რიტმს აყოლილი.</p>
              <p><b>მიზეზი:</b> ვენტილატორი კორპუსს ეხახუნება — ან მონტაჟია უხარისხო, ან ბლოკი დროთა განმავლობაში გადაიხარა. ზოგჯერ უცხო სხეულია დამნაშავე: ფოთოლი, ჩიტის ბუდე, ზოგჯერ თაგვიც კი.</p>
              <p><b>რა ვქნათ:</b> კონდიციონერი მაშინვე გამორთეთ. დაათვალიერეთ გარე ბლოკის ვენტილატორი — თუ უცხო საგანს შეამჩნევთ, ფრთხილად ამოიღეთ. მექანიკური დაზიანების შემთხვევაში ტექნიკოსი გამოიძახეთ.</p>

            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>ვიბრაცია</h2>
              <p><b>როგორ ჟღერს:</b> სუსტი ჟღრიალი ან ვიბრაცია შიდა ბლოკიდან, რომელიც თანდათან ძლიერდება.</p>
              <p><b>მიზეზი №1 — ფილტრი:</b> ცუდად ზის ან დაბინძურებულია და ჰაერის ნაკადში თრთის.</p>
              <p><b>მიზეზი №2 — დახრილი მონტაჟი:</b> შიდა ბლოკი ჰორიზონტალურად არ არის დამაგრებული და ვიბრაცია ძლიერდება.</p>
              <p><b>რა ვქნათ:</b> ჯერ ფილტრი გაწმინდეთ. თუ ხმაური მაინც რჩება, თარაზოთი (გამოდგება ტელეფონის აპლიკაციაც) შეამოწმეთ, სწორად ზის თუ არა ბლოკი — დახრილს მემონტაჟე ხელახლა დაამაგრებს.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>წყლის ხმა</h2>
              <p><b>როგორ ჟღერს:</b> ბულყუნი ან წყლის ჩხრიალი შიდა ბლოკიდან.</p>
              <p><b>მიზეზი:</b> კონდენსატის გადინება ფერხდება — დრენაჟის მილი დაცობილია და წყალი გასასვლელს ვეღარ პოულობს.</p>
              <p><b>რა ვქნათ:</b> შეამოწმეთ დრენაჟის გარეთა მილი — გამოდის თუ არა წყალი შეუფერხებლად. დაცობილი მილი გაწმინდეთ (ხშირად ფოთლები ან ჭიანჭველები ახშობს). გაწმენდის შემდეგ ხმა უნდა გაქრეს.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>გარე ბლოკის მძიმე გუგუნი</h2>
              <p><b>როგორ ჟღერს:</b> გარე ბლოკიდან მომავალი მუდმივი, მძიმე გუგუნი, რომელიც დროთა განმავლობაში ძლიერდება.</p>
              <p><b>მიზეზი:</b> კომპრესორი ცვდება (8 წელს გადაცილებულ მოწყობილობებში ხშირია) ან ანტივიბრაციული რეზინებია დაზიანებული.</p>
              <p><b>რა ვქნათ:</b> ანტივიბრაციული რეზინების შეცვლა 50–80 ლარი ღირს. კომპრესორის შეცვლა — 400–800 ლარი; ამ ფასად ხშირად ახალი კონდიციონერის ყიდვა უფრო გამართლებულია.</p>
            </section>

                role="ინჟინერი · 12 წელი HVAC მონტაჟში"
                bio="12 წელია კონდიციონერების მონტაჟზე ვმუშაობ თბილისში. ტექნიკას რეალურ ბინებში ვამოწმებ და პრობლემებსაც იქვე ვიკვლევ — მხოლოდ ქაღალდის სპეციფიკაციებს არ ვენდობი."

          </div>
