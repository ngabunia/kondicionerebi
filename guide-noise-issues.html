            <section style={{ paddingTop: 48 }}>
              <h2>ლითონის ხახუნი (მექანიკური)</h2>
              <p><b>ბგერა:</b> მკვეთრი ლითონური ხმა, ვენტილატორის ბრუნვის რიტმში მეორდება.</p>
              <p><b>მიზეზი:</b> ვენტილატორი ეხახუნება კორპუსს — ცუდი მონტაჟის ან მისი დახრის გამო. შესაძლოა მიზეზი იყოს უცხო საგანი — ფოთოლი, ფრინველის ბუდე, თაგვი — ვენტილატორის ხვრელში.</p>
              <p><b>რა ვქნათ:</b> სასწრაფოდ გამორთეთ კონდიციონერი. დაათვალიერეთ გარე ბლოკის ვენტილატორი — თუ უცხო საგანი ხედავთ, ფრთხილად ამოიღეთ. თუ მექანიკური დაზიანებაა — გამოიძახეთ ტექნიკოსი.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>სუსტი სისინი (ნორმალური)</h2>

              <p><b>მიზეზი:</b> ფრიონის წნევის ცვალებადობა გრილების ციკლის დასაწყისში — ნორმალური ფიზიკური პროცესია.</p>

            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>ვიბრაცია</h2>
              <p><b>ბგერა:</b> სუსტი რყევა ან ვიბრაცია შიდა ბლოკიდან, რომელიც ნელ-ნელა ძლიერდება.</p>
              <p><b>მიზეზი #1 — ფილტრის ვიბრაცია:</b> ფილტრი ცუდად ზის ან დაბინძურებულია — ჰაერის ნაკადში ხტუნაობს.</p>
              <p><b>მიზეზი #2 — დახრილი მონტაჟი:</b> შიდა ბლოკი არ დევს ჰორიზონტალურად — ვიბრაცია ძლიერდება.</p>
              <p><b>რა ვქნათ:</b> 1) გასუფთავეთ ფილტრი. 2) თუ ფილტრის გასუფთავების შემდეგ ხმაური რჩება — შეამოწმეთ ბლოკის ჰორიზონტალურობა დონის აპლიკაციით. თუ დახრილია — მონტიორი ხელახლა დააყენებს.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>წყლის ხმა</h2>
              <p><b>ბგერა:</b> „ღურღული“ ან წყლის ხმა შიდა ბლოკიდან.</p>
              <p><b>მიზეზი:</b> კონდენსატის გადინების სისტემაში პრობლემაა — დრენაჟის ხვრელი დახშულია, ან წყალი ცდილობს ფასადზე გაიჟონოს.</p>
              <p><b>რა ვქნათ:</b> შეამოწმეთ გარე დრენაჟის მილი — გადის თუ არა წყალი ნორმალურად. თუ მილი დახშულია, გაუსუფთავეთ (ფოთლები ან ჭიანჭველებია ხშირად მიზეზი). გასუფთავების შემდეგ ხმაური უნდა გათავდეს.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>გარე ბლოკის მაღალი ხმაური</h2>
              <p><b>ბგერა:</b> გარე ბლოკიდან მუდმივი მძიმე ხმაური, რომელიც დროთა განმავლობაში ძლიერდება.</p>
              <p><b>მიზეზი:</b> კომპრესორი ცვდება (8+ წლის მოწყობილობებში ხშირია) ან მისი ანტი-ვიბრაციული რეზინი დაზიანებულია.</p>

            </section>

            </div>
          </div>
        </main>
