<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>უცნაური ხმაური კონდიციონერიდან — kondicionerebi.ge</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="site2.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="ArticleHeader.jsx"></script>
  <script type="text/babel" src="TLDR.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="Author.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const tldr = [
      { label: "კლანკი", text: 'მექანიკური დაშავება — ვენტილატორი ეხება კორპუსს. გათიშე და დარეკე ტექნიკოსს.' },
      { label: "ფიხთი", text: 'ფრიონის წნევის ცვალებადობა — ნორმალურია გაშვების ნახევარ წუთში' },
      { label: "ნაცარი", text: 'ფილტრის ვიბრაცია ან ცუდი მონტაჟი — შემოწმე ფილტრი ჯერ' },
      { label: "შრიალი", text: 'წყლის გაჟონვა შიდა ბლოკიდან — სასწრაფო ცდის გადატარება' },
    ];

    const faqs = [
      { q: "ცოტა ხმაური ნორმალურია?",
        a: "კი — ვენტილატორი და კომპრესორი მუშაობენ. სტანდარტული ხმაური 19-30 dB დღის რეჟიმში — ფონური მსგავსი. თუ ხმაური მკვეთრად გაიზრდა ან ახალი ხმაური გამოჩნდა — ეს ნიშანი." },
      { q: "გათიშვის შემდეგაც ხმაური?",
        a: "Inverter მოდელები გათიშვის შემდეგ 1-2 წუთი მუშაობენ ფრიონის წნევის გასათანაბრებლად — ეს ნორმალურია. თუ ხმაური 5+ წუთი გრძელდება — ვენტილატორი ვერ ჩერდება ან რეპელე გაცეცხდა." },
      { q: "ღამის რეჟიმი არ მუშაობს?",
        a: "ღამის რეჟიმი (Night mode / Sleep) ამცირებს ვენტილატორის სიჩქარეს და ხმაურს. თუ ეს რეჟიმი ჩართულია, მაგრამ ხმაური მაინც მაღალია — ან ფილტრის ვიბრაცია, ან ცუდი მონტაჟი (გადახრილი მოწყობილობა)." },
      { q: "სიცოცხლის ბოლოა?",
        a: "ხშირად — არა. ხმაური უმეტესად მექანიკური პრობლემაა, რომელიც გადაიჭრება. გამონაკლისი — კომპრესორის ხმაური (მაღალი ფიხთი ან მექანიკური ციმციმი) 8+ წლის მოწყობილობაში. ცვლის ფასი ხშირად მთლიანი მოწყობილობის ფასს უტოლდება." },
    ];

    const App = () => (
      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "უცნაური ხმაური" },
              ]}
              title="უცნაური ხმაური კონდიციონერიდან"
              dek="კლანკი, წყნარი ფიხთი, ნაცარი — სხვადასხვა ხმაური სხვადასხვა მიზეზის სიგნალია. გავიგოთ, რომელი მოითხოვს სასწრაფო ცდას."
              authorInitials="გჭ"
              authorName="გიორგი ჭიჭინაძე"
              authorRole="ინჟინერი · მონტაჟი და სერვისი"
              updated="22 თებერვალი 2026"
              readTime="5 წუთის წასაკითხი"
              heroCaption="ხმაურის სხვადასხვა ტიპი — სხვადასხვა მიზეზის ნიშანი."
            />

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>კლანკი / გრიხილი (მექანიკური)</h2>
              <p><b>ბგერა:</b> მკვეთრი ლითონის ხმაური, რეგულარული „ჩაკ-ჩაკ“ ან „გრიხ-გრიხ“ ვენტილატორის ბრუნვის რიტმში.</p>
              <p><b>მიზეზი:</b> ვენტილატორი ეხება კორპუსს — ხშირად ცუდი მონტაჟის გამო ან გადახრის შემდეგ. ან კიდევ — უცხო საგანი (ფოთოლი, ცოცხალი არსება) ვენტილატორის ხვრელში.</p>
              <p><b>ცდა:</b> სასწრაფოდ გათიშე კონდიციონერი. გადახედე ვენტილატორის ხვრელს (გარე ბლოკში) — ფოთლები, ფრინველის ბუდე, თაგვი. თუ უცხო საგანი — ამოიღე. თუ მექანიკური დაშავება — ტექნიკოსი აუცილებელია.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>წყნარი ფიხთი (ნორმალური)</h2>
              <p><b>ბგერა:</b> წყნარი „ფშ-ფშ“ ან „ფიხთი“ ბგერა, ხშირად კონდიციონერის გაშვებიდან 5-30 წამში.</p>
              <p><b>მიზეზი:</b> ფრიონის წნევის ცვალებადობა გრილების ციკლის დასაწყისში — ნორმალური ფიზიკური პროცესი.</p>
              <p><b>ცდა:</b> არ საჭიროებს — გავა 1-2 წუთში. თუ ფიხთი ჩერდება გაშვებიდან 1 წუთის შემდეგ ან მუშაობს უწყვეტად — ფრიონის გაჟონვის ნიშანი, ტექნიკოსი საჭიროა.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>ნაცარი / ვიბრაცია</h2>
              <p><b>ბგერა:</b> სუსტი ვიბრაცია ან „ნაცარი“ ხმაური შიდა ბლოკიდან, რომელიც ნელ-ნელა იზრდება.</p>
              <p><b>მიზეზი #1 — ფილტრის ვიბრაცია:</b> ფილტრი არ ზის სწორად ან ბინძურია — გადადის ჰაერის ნაკადში.</p>
              <p><b>მიზეზი #2 — გადახრილი მონტაჟი:</b> შიდა ბლოკი არ არის ჰორიზონტალურად — გრავიტაცია ამოღებს ვიბრაციას.</p>
              <p><b>ცდა:</b> 1) გასუფთავე ფილტრი. 2) თუ ფილტრის გაცვლის შემდეგ ხმაური რჩება — დახედე ბლოკის ჰორიზონტალურობას (ფანქარი / დონე). თუ გადახრილია — ტექნიკოსი მოაკეთებს.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>შრიალი / წყლის ხმა</h2>
              <p><b>ბგერა:</b> „ქშქშ“ ან წყლის გადინების ხმაური შიდა ბლოკიდან.</p>
              <p><b>მიზეზი:</b> კონდენსატის (ცივი მილზე გროვდება წყალი) გადინების სისტემაში პრობლემა — დრენაჟის ხვრელი დახშულია, ან წყალი ცდილობს გაჟონოს ფასადზე.</p>
              <p><b>ცდა:</b> შემოწმე გარე დრენაჟის მილი — დახედე, წყალი მართლა გადის თუ არა. თუ მილი დახშულია — ცდის გაწმენდა (ხშირად ჭიანჭველებით ან ფოთლებით ხდება). ცდის გადატარების შემდეგ ხმაური უნდა გათავდეს.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>გარე ბლოკის მაღალი ხმაური</h2>
              <p><b>ბგერა:</b> გარე ბლოკიდან მუდმივი მძიმე ხმაური, რომელიც დროთა განმავლობაში გაიზარდა.</p>
              <p><b>მიზეზი:</b> კომპრესორი იწურება (8+ წლის მოწყობილობებში ხშირია) ან გადახურდა მისი ფიქსაცია (ანტი-ვიბრაციული რეზინი დაშავდა).</p>
              <p><b>ცდა:</b> ანტი-ვიბრაციული რეზინის ცვლა — 50-80 ლარი. კომპრესორის ცვლა — 400-800 ლარი, ხშირად მთლიანი მოწყობილობის ცვლა უფრო რენტაბელურია.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="გჭ"
                name="გიორგი ჭიჭინაძე"
                role="ინჟინერი · 12 წლის გამოცდილება HVAC მონტაჟში"
                bio="12 წლის გამოცდილება HVAC მონტაჟში თბილისში. ვამოწმებ ტექნიკურ მახასიათებლებსა და ვიკვლევ პრობლემებს რეალურ ბინებში — არა მწარმოებლის სპეციფიკაციით."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
