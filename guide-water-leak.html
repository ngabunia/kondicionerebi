<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>წყალი ჟონავს კონდიციონერიდან — kondicionerebi.ge</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="site2.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="ArticleHeader.jsx"></script>
  <script type="text/babel" src="TLDR.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="Author.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const tldr = [
      { label: "სასწრაფო", text: 'გათიშე კონდიციონერი, შემოწმე გრძელი მილი — ხშირად დახშულია' },
      { label: "მიზეზი #1", text: 'დრენაჟის მილი დახშულია — წყალი ვერ გადის გარეთ' },
      { label: "მიზეზი #2", text: 'შიდა ბლოკი გადახრილია — წყალი ვერ მიდის დრენაჟის გასასვლელისკენ' },
      { label: "ცდა", text: '<span class="latin">5</span>-წუთიანი დიაგნოსტიკა შეიძლება მოაგვაროს ყველაფერი' },
    ];

    const faqs = [
      { q: "რატომ ცვივა წყალი კონდიციონერიდან საერთოდ?",
        a: "კონდიციონერი გრილებისას ცივი მილზე გროვდება კონდენსატი (ჰაერის ტენი წყლად გადადის). ეს წყალი უნდა გაიაროს დრენაჟის სისტემაში გარეთ. თუ რამე იყო წყლის გადინებაში — ცვივა შიდა ბლოკიდან." },
      { q: "შემიძლია თვითონ მოვაგვარო?",
        a: "ხშირად — კი. დრენაჟის მილის გაწმენდა შესაძლებელია სტანდარტული მავთულით ან წნევით (ხელნახელი ნაცარი ცდის). თუ მილი ხელმისაწვდომია გარეთა — 90% შემთხვევაში თვითონ მოაგვარებთ. თუ მილი ჩახშულია კედლის შიგნით — ტექნიკოსი." },
      { q: "შემიძლია გავაგრძელო გამოყენება?",
        a: "მცირე პერიოდი — კი, თუ ცდის ქვეშ წყლის ჩასაჭერი (ვედრო ან კალთა) დაიდე. გრძელვადიანი — არა. წყალი დაშავებს კედლებს, ფაიფანას, შესაძლოა ცემენტ-პლასტიკის გადარჩენაც." },
      { q: "ცარდანი ვიწროვდა?",
        a: "თუ კონდიციონერი ცარდანი (გათბობის რეჟიმი) მუშაობდა და ცარდანიდან წყალი ცვივა — გარე ბლოკის დრენაჟის სისტემაა გათოვლილი ან გათბობის რეჟიმის გადადგმის შეცდომა. ტექნიკოსი აუცილებელია." },
    ];

    const App = () => (
      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "წყალი ჟონავს" },
              ]}
              title="წყალი ჟონავს — სასწრაფო რჩევები"
              dek="5 წუთიანი დიაგნოსტიკა სანამ ტექნიკოსს გამოიძახებთ. უმეტეს შემთხვევაში გადასაჭრელია თვითნაკეთო ცდით."
              authorInitials="ნჯ"
              authorName="ნიკა ჯავახიშვილი"
              authorRole="მთავარი რედაქტორი"
              updated="15 თებერვალი 2026"
              readTime="4 წუთის წასაკითხი"
              heroCaption="დრენაჟის მილი — ხშირად ფოთლებით ან მტვერით დახშული."
            />

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>სასწრაფო ცდები (5 წუთი)</h2>
              <ol style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>გათიშე კონდიციონერი.</b> ცდის ჩასაჭერი (ვედრო, კალთა) დააწვი წყლის ცვივის ქვეშ.</li>
                <li><b>გასცე გარეთ.</b> შემოწმე, სად გადის დრენაჟის მილი (ჩვეულებრივ თხელი თეთრი ან გამჭვირვალე მილი) გარეთა ფასადზე. წყალი მართლა გადის თუ არა?</li>
                <li><b>თუ წყალი არ გადის გარეთ:</b> მილი ჩახშულია. დაიწყე ცდის გაწმენდით.</li>
                <li><b>თუ წყალი გადის გარეთ ნორმალურად:</b> შიდა ბლოკი გადახრილია, ან წყლის ცდის გადადგმის შეცდომა. ტექნიკოსი საჭიროა.</li>
              </ol>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>დრენაჟის მილის გაწმენდა</h2>
              <p>გარეთ მილი დახშულია (ფოთლები, მტვერი, ჭიანჭველები ხშირად ჩვეულებრივი მიზეზებია). გაწმენდის ცდები:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>მავთული.</b> თხელი მავთული ან მავთულის ჯაგრისი — ნელ-ნელა შეუშვი მილში გარეთა ბოლოდან.</li>
                <li><b>წნევით.</b> წისქვილის ან ჭის შლანგი გადააბი მილის გარეთა ბოლოს — წყლის ნაკადი წინ მიდის და გაიხსნება.</li>
                <li><b>ვაკუუმი.</b> სამზარეულოს ვაკუუმის ცდილობა — გასცე გარეთა ბოლოს, წოვით ამოიღებს ფოთლებსა და მტვერს.</li>
              </ul>
              <p>გაწმენდის შემდეგ — გადაიყვანე კონდიციონერი 10-15 წუთის განმავლობაში და შემოწმე ცდის ნორმალური გადინება.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>გადახრილი შიდა ბლოკი</h2>
              <p>კონდიციონერის შიდა ბლოკი მონტაჟი მოითხოვს მცირე გადახრას დრენაჟის გასასვლელისკენ — ისე, რომ წყალი ბუნებრივად მიიდინოს გარეთ. დროთა განმავლობაში ცვედვა (კედლის შემცირება, მაგრების მოშვება) შესაძლოა გადახრა გადააქცეს არასწორი მიმართულებით.</p>
              <p><b>შემოწმება:</b> სამშენებლო დონე ან მობილური ტელეფონის დონის აპლიკაცია — დააწვი შიდა ბლოკზე. გადახრა უნდა იყოს მცირე, დრენაჟის გასასვლელისკენ.</p>
              <p><b>გადაჭრა:</b> ბლოკის ხელახალი დონის გადაკეთება — მონტიორის სამუშაოა, 80-150 ლარი.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როდის გამოვიძახოთ ტექნიკოსი</h2>
              <p>თუ თვითნაკეთო ცდის შემდეგ პრობლემა გრძელდება:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>დრენაჟის მილის გაწმენდის შემდეგ წყლის გადინება არ აღდგა</li>
                <li>წყალი ცვივა ერთდროულად რამდენიმე ადგილიდან — ვერ ხედავთ რა მხრიდან</li>
                <li>დრენაჟის მილი დაშავდა ან გადაჭრილია კედლის შიგნით</li>
                <li>კონდიციონერი ცარდანი (გათბობის) რეჟიმში ჟონავს</li>
              </ul>
              <p>ტექნიკოსის გამოძახება — 80-150 ლარი დიაგნოსტიკისთვის. რემონტი — ცალკე, ფასი დამოკიდებულია პრობლემაზე.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="ნჯ"
                name="ნიკა ჯავახიშვილი"
                role="მთავარი რედაქტორი · 6 წლის გამოცდილება კონდიციონერების ანალიზში"
                bio="ვტესტავ კონდიციონერებს რეალურ ბინებში თბილისში. ვცდილობ, რომ ყოველი რეკომენდაცია იყოს გამოცდილების შედეგი, არა მარკეტინგული მასალის გადათარგმნა."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
