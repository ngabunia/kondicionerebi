<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>წყალი ჟონავს კონდიციონერიდან — kondicionerebi.ge</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="site2.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="ArticleHeader.jsx"></script>
  <script type="text/babel" src="TLDR.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="Author.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const tldr = [
      { label: "სასწრაფო", text: 'გამორთეთ კონდიციონერი და შეამოწმეთ დრენაჟის მილი — უმეტესად დახშულია' },
      { label: "მთავარი მიზეზი", text: 'დრენაჟის მილი დახშულია — წყალი ვერ გადის გარეთ' },
      { label: "მეორე მიზეზი", text: 'შიდა ბლოკი არასწორად დევს — წყალი ვერ აღწევს დრენაჟის ხვრელამდე' },
      { label: "დიაგნოსტიკა", text: '<span class="latin">5</span>-წუთიანი შემოწმება ხშირად აგვარებს პრობლემას' },
    ];

    const faqs = [
      { q: "რატომ წვეთავს წყალი კონდიციონერიდან?",
        a: "კონდიციონერი როცა აცივებს ოთახს, ცივ მილზე გროვდება კონდენსატი — ჰაერის ტენი წყლად გადადის. ეს წყალი დრენაჟის მილით უნდა გავიდეს გარეთ. თუ ეს გზა დახშულია, წყალი იღვრება შიდა ბლოკიდან ოთახში." },
      { q: "შემიძლია თვითონ მოვაგვარო?",
        a: "უმეტესად — კი. დრენაჟის მილის გაწმენდა შესაძლებელია თხელი მავთულით ან წყლის წნევით. თუ მილი ფასადის გარეთ გამოდის და მისი ბოლო ხელმისაწვდომია, შემთხვევათა 90%-ში გაუმკლავდებით თვითონ. თუ მილი კედლის შიგნით არის გადაბმული — სჯობს დარეკოთ ტექნიკოსს." },
      { q: "შემიძლია გავაგრძელო გამოყენება?",
        a: "მცირე ხნით — კი, თუ წყლის წვეთვის ქვეშ ჭურჭელს ან ტაშტს დაიდებთ. გრძელვადიანი გამოყენება — არა: წყალი დააზიანებს კედლებს, ფაიფანას და, შესაძლოა, თქვენი ან ქვედა მეზობლის რემონტს." },
      { q: "გათბობის რეჟიმში ჟონავს — რა მიზეზია?",
        a: "თუ კონდიციონერი გათბობის რეჟიმში მუშაობდა და წყალი იღვრება, ეს ნიშნავს, რომ გარე ბლოკის დრენაჟის სისტემა გათოვლილია ან გათბობის რეჟიმის გადართვა გაუმართავად ხდება. ამ შემთხვევაში ტექნიკოსი აუცილებელია." },
    ];

    const App = () => (
      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "წყალი ჟონავს" },
              ]}
              title="წყალი ჟონავს — სასწრაფო რჩევები"
              dek="5 წუთიანი დიაგნოსტიკა სანამ ტექნიკოსს გამოიძახებთ. პრობლემა უმეტესად თვითონ წყდება."
              authorInitials="ნჯ"
              authorName="ნიკა ჯავახიშვილი"
              authorRole="მთავარი რედაქტორი"
              updated="15 თებერვალი 2026"
              readTime="4 წუთის წასაკითხი"
              heroImg="images/photos/ac-indoor.jpg"
              heroCaption="დრენაჟის მილი — ხშირად ფოთლებითა და მტვერითაა დახშული."
            />

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>სასწრაფო ნაბიჯები (5 წუთი)</h2>
              <ol style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>გამორთეთ კონდიციონერი.</b> წყლის წვეთვის ქვეშ ჭურჭელი ან ტაშტი დადგით.</li>
                <li><b>გადით გარეთ.</b> ნახეთ, საიდან გამოდის დრენაჟის მილი ფასადზე — ეს არის თხელი თეთრი ან გამჭვირვალე მილი. შეამოწმეთ, წყალი მართლა გადის თუ არა.</li>
                <li><b>თუ წყალი არ გადის გარეთ:</b> მილი დახშულია — დაიწყეთ მისი გაწმენდით.</li>
                <li><b>თუ წყალი ნორმალურად გადის:</b> შიდა ბლოკი არასწორად დევს ან დრენაჟის სისტემაშია პრობლემა — ტექნიკოსი დაგჭირდებათ.</li>
              </ol>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>დრენაჟის მილის გაწმენდა</h2>
              <p>თუ მილი დახშულია (ჩვეულებრივ ფოთლები, მტვერი ან ჭიანჭველებია მიზეზი), არსებობს რამდენიმე გზა:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li><b>მავთული.</b> თხელი მავთული ან მავთულის ჯაგრისი ფრთხილად შეუშვით მილში გარეთა ბოლოდან.</li>
                <li><b>წყლის წნევით.</b> ბაღის ან ჭის შლანგი მიამაგრეთ მილის გარეთა ბოლოს — წყლის ნაკადი მილს გაასუფთავებს.</li>
                <li><b>ვაკუუმი.</b> სამზარეულოს მტვერსასრუტი მიადევით მილის გარეთა ბოლოს — წოვით ამოიღებთ ფოთლებსა და მტვერს.</li>
              </ul>
              <p>გაწმენდის შემდეგ ჩართეთ კონდიციონერი 10-15 წუთით და ნახეთ, აღდგა თუ არა წყლის ნორმალური გადინება.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>არასწორად დადგმული შიდა ბლოკი</h2>
              <p>კონდიციონერის შიდა ბლოკი მონტაჟისას უმცირესი დახრილობით უნდა დაიდგას დრენაჟის ხვრელისკენ, რომ წყალი ბუნებრივად მიდიოდეს გარეთ. დროთა განმავლობაში სამაგრები შეიძლება მოეშვას და დახრილობა შეიცვალოს.</p>
              <p><b>შემოწმება:</b> სამშენებლო დონით ან მობილური ტელეფონის დონის აპლიკაციით შეამოწმეთ შიდა ბლოკი. დახრილობა უნდა იყოს მცირე და დრენაჟის ხვრელისკენ მიმართული.</p>
              <p><b>გადაჭრა:</b> ბლოკის ხელახალი დაყენება — მონტიორის სამუშაოა, 80-150 ლარი.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როდის გამოვიძახოთ ტექნიკოსი</h2>
              <p>თუ თვითონ შემოწმების შემდეგ პრობლემა გრძელდება:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>დრენაჟის მილის გაწმენდის შემდეგ წყლის გადინება არ აღდგა</li>
                <li>წყალი იღვრება ერთდროულად რამდენიმე ადგილიდან</li>
                <li>დრენაჟის მილი დაზიანებულია ან კედლის შიგნით გადატეხილია</li>
                <li>კონდიციონერი გათბობის რეჟიმში ჟონავს</li>
              </ul>
              <p>ტექნიკოსის გამოძახება — 80-150 ლარი დიაგნოსტიკისთვის. რემონტი ცალკე ფასდება, კონკრეტული პრობლემის მიხედვით.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="ნჯ"
                name="ნიკა ჯავახიშვილი"
                role="მთავარი რედაქტორი · 6 წლის გამოცდილება კონდიციონერების ანალიზში"
                bio="ვტესტავ კონდიციონერებს რეალურ ბინებში თბილისში. ჩემი მიზანია, ყოველი რეკომენდაცია გამოცდილებას ემყარებოდეს და არა მწარმოებლის მარკეტინგულ მასალას."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
