<body>

  <script type="text/babel" src="Author.jsx"></script>

  <script type="text/babel">
    const tldr = [
      { label: "ფილტრი", text: 'ბინძური ფილტრი — გრილებას ამცირებს <span class="latin">30-50%</span>. 5 წუთიანი გაწმენდა.' },
      { label: "ფრიონი", text: 'გაჟონვა — ცივი მილი ნახჯრიანია. ტექნიკოსი აუცილებელია.' },
      { label: "ფასადი", text: 'გარე ბლოკი მზის ქვეშ ან ცხელ ფასადზე — გრილება ვერ ჩამოდის.' },
      { label: "ფანჯარა", text: 'გაღებული კარი ან ფანჯარა — გრილი ჰაერი გადის გარეთ.' },
    ];

    const faqs = [
      { q: "კონდიციონერი მუშაობს, მაგრამ ცივი ჰაერი არ მოდის",
        a: "უმეტესად — ფრიონის გაჟონვა. შემოწმეთ ცივი მილი — თუ ნახჯრიანია (თეთრი ზედაპირი) ან თვალნათლივი წყლის გაცილიდან, ეს ნიშნავს ფრიონის ნაკლებობას. ტექნიკოსი აუცილებელია — ფრიონის ჩატენა და გაჟონვის შემოწმება." },
      { q: "ცივი ჰაერი მოდის, მაგრამ ოთახი არ ცივდება",
        a: "სამი ხშირი მიზეზი: 1) ფანჯარა/კარი ღია — ცივი ჰაერი გადის. 2) კონდიციონერი დიდი ოთახისთვის სუსტია (BTU არ აქვს საკმარისი). 3) ცხელი წყაროები (კომპიუტერი, განათება, მზე ფანჯრიდან) აცილებენ კონდიციონერის გავლენას." },
      { q: "ცივი მილი ცივი, მაგრამ მაინც ცუდი გრილება",
        a: "შეამოწმეთ გარე ბლოკი — გადახურდა შესაძლოა. თუ ბლოკი ცხელია (60°C+), ვენტილატორი ცუდად მუშაობს ან გრილების სისტემაა გაჭედილი. ხელით ცდით ვენტილატორის ბრუნვა." },
      { q: "ნაკლები სრულიად მუშაობს",
        a: "უმეტესად — დაიწურა ფრიონი ან კონდენსატორი დაშავდა. დიაგნოსტიკა ტექნიკოსისგან — 80-120 ლარი. შემდეგ შეგიძლიათ გადაწყვიტოთ რემონტი თუ ცვლა." },
    ];

            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "არ აცივებს" },
              ]}
              title="კონდიციონერი არ აცივებს — რა ვქნათ?"

              authorName="ნიკა ჯავახიშვილი"

              updated="29 თებერვალი 2026"
              readTime="6 წუთის წასაკითხი"
              heroCaption="ფილტრის გასუფთავება — 5 წუთიანი დავალება, რომელიც ხშირად აგვარებს პრობლემას."

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>1. ბინძური ფილტრი (ხშირი #1)</h2>
              <p>5 ხშირი მიზეზიდან ერთი — ბინძური ფილტრი. გრილების სიმძლავრე ეცემა 30-50%-ით ბინძური ფილტრის გამო. შემოწმება:</p>
              <ol style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გახსენით შიდა ბლოკის წინა პანელი (ჩვეულებრივ ზემოდან აქვს „ხელის“ ხელადი)</li>
                <li>ამოიღეთ ფილტრი (ბადისებური ფირფიტა)</li>
                <li>თუ რუხი ან მტვრიანი — გაწმინდე წყლით ან მტვერსასრუტით</li>
                <li>გააშრე ჰაერზე (არა მზის ქვეშ)</li>
                <li>დააბრუნე უკან</li>
              </ol>
              <p>რეგულარული გასუფთავება: 4-6 კვირაში ერთხელ.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>2. ფრიონის გაჟონვა</h2>
              <p>კონდიციონერი მუშაობს, ვენტილატორი ბრუნავს, მაგრამ ცივი ჰაერი არ მოდის — ეს ფრიონის გაჟონვის სიგნალია. ჩვენ შემოწმება:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გარე ბლოკთან ცივი მილი (თხელი მილი) — თუ მასზე თეთრი ნახჯრიანი ფენაა, ფრიონის წნევა დაბალია</li>
                <li>გრძელ მუშაობის შემდეგ ცივი წვეთები მონტაჟის ხვრელიდან</li>
                <li>კონდიციონერი თვითონ ხშირად გამოირთვება ცდის რეჟიმში</li>
              </ul>
              <p>გადაჭრა: ტექნიკოსი ფრიონის ჩატენით — 150-250 ლარი. ჯერ უნდა იპოვოს გაჟონვის ადგილი და გადააკეთოს ის — ჩუმად ფრიონის ჩატენა 6-12 თვეში ისევ ცარიელდება.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>3. გადახურებული გარე ბლოკი</h2>
              <p>ცხელი დღე, გარე ბლოკი პირდაპირ მზის ქვეშ ან ცხელ ფასადზე — ბლოკი გადახურდება და დაცვის სისტემა შეაჩერებს მუშაობას ან მუშაობს მინიმუმ სიმძლავრით. შემოწმება:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გარე ბლოკის ფასადი ცხელია — ხელით ვერ ეცემთ</li>
                <li>ვენტილატორი არ ბრუნავს, ან ნელა ბრუნავს</li>
                <li>ცხელ საათებში პრობლემა მძიმდება, საღამოს ცოტა უმჯობესდება</li>
              </ul>
              <p>გადაჭრა მოკლე ვადით — ცივი წყლის გაფრქვევა გარე ბლოკის ფასადზე (გრილებს ერთბაშად). გრძელვადიანი — გადატანა ჩრდილოვან ადგილზე ან მზის დამცავი (sun shade) მონტაჟი.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>4. გადადგმის შეცდომა</h2>
              <p>კონდიციონერი 9000 BTU (25 კვ.მ-ის ფარგლებში) დიდი 35-40 კვ.მ ოთახისთვის — ცივი ჰაერი ვერასოდეს არ ემახსოვრება ოთახს. შემოწმება:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გადაზომე ოთახის ფართობი (სიგრძე × სიგანე)</li>
                <li>გადაიტანე ჩვენი <a href="btu.html">BTU კალკულატორზე</a> — გადაამოწმე საჭირო BTU</li>
                <li>თუ კონდიციონერი 30%-ით ნაკლები სიმძლავრით ფლობს — ერთადერთი გადაჭრა ცვლა ან მეორე მოწყობილობის დამატება</li>
              </ul>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>5. ცხელი წყაროები ოთახში</h2>
              <p>კონდიციონერი მუშაობს კარგად, BTU სწორად, ფილტრი სუფთა — მაგრამ ოთახი ცხელია. ხშირი მიზეზი — ცხელი წყაროები შიგნით:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გაღებული კარი ან ფანჯარა — ცივი ჰაერი გადის</li>
                <li>კომპიუტერი ან სხვა ტექნიკა (გასცემს 200-400 ვტ სითბოს)</li>
                <li>ცხელი მზე ფანჯრიდან (სამხრეთის ფასადი)</li>
                <li>ბევრი ხალხი (1 ადამიანი = 100 ვტ სითბო)</li>
                <li>ცხელი სამზარეულო (გრილს გაცილებით აცილდება)</li>
              </ul>
              <p>გადაჭრა: ფარდები სამხრეთის ფანჯრებზე, კარები დახურული, კონდიციონერი დააყენე ცხელ ოთახში სადაც დიდხანს ხართ.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როდის ვუხმოთ ტექნიკოსს</h2>
              <p>თვითნაკეთო შემოწმების შემდეგ, თუ:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>ფილტრი სუფთაა, ფანჯრები დახურულია, BTU სწორად შერჩეული — მაგრამ მაინც ცუდად მუშაობს</li>
                <li>ცივი მილი ნახჯრიანია (ფრიონის გაჟონვა)</li>
                <li>გარე ბლოკი არ ბრუნავს ან ცხელია</li>
                <li>კონდიციონერი იშვიათად მუშაობს ან თვითონ გამოირთვება</li>
              </ul>
              <p>დიაგნოსტიკის ფასი — 80-120 ლარი. ეს არ შედის რემონტში — მხოლოდ პრობლემის გამოვლენა. რეკომენდირებული ბრენდის სერტიფიცირებული ტექნიკოსი.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="ნჯ"
                name="ნიკა ჯავახიშვილი"
                role="მთავარი რედაქტორი · 6 წლის გამოცდილება კონდიციონერების ანალიზში"
                bio="ვტესტავ კონდიციონერებს რეალურ ბინებში თბილისში. ვცდილობ, რომ ყოველი რეკომენდაცია იყოს გამოცდილების შედეგი, არა მარკეტინგული მასალის გადათარგმნა."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
