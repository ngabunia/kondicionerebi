<body>

  <script type="text/babel">
    const tldr = [
      { label: "ფილტრი", text: 'დაბინძურებული ფილტრი ამცირებს გრილებას <span class="latin">30-50%</span>-ით — 5 წუთიანი გასუფთავება' },
      { label: "ფრიონი", text: 'გაჟონვის ნიშანი — ცივი მილი ყინულითაა დაფარული. ტექნიკოსი აუცილებელია.' },
      { label: "გარე ბლოკი", text: 'პირდაპირ მზის ქვეშ ან ცხელ ფასადზე — ეფექტიანობა მკვეთრად ეცემა' },
      { label: "ფანჯარა / კარი", text: 'გაღებული კარი ან ფანჯარა — გრილი ჰაერი მაშინვე გადის გარეთ' },
    ];

    const faqs = [
      { q: "კონდიციონერი მუშაობს, მაგრამ ცივი ჰაერი არ მოდის",
        a: "უმეტესად — ფრიონის გაჟონვა. შეამოწმეთ ცივი მილი: თუ მასზე თეთრი ყინულის ფენაა ან წვეთები იღვრება, ფრიონის წნევა დაბალია. ტექნიკოსმა უნდა იპოვოს გაჟონვის ადგილი და შემდეგ ჩატენოს ფრიონი — წინააღმდეგ შემთხვევაში 6-12 თვეში ისევ ცარიელდება." },
      { q: "ცივი ჰაერი მოდის, მაგრამ ოთახი არ ცივდება",
        a: "სამი ხშირი მიზეზი: 1) ფანჯარა ან კარი ღიაა და გრილი ჰაერი გადის გარეთ. 2) კონდიციონერი ოთახისთვის სუსტია — BTU არ ყოფნის. 3) ოთახში ბევრი სითბური წყაროა (კომპიუტერი, განათება, მზე ფანჯრიდან), რომელიც კონდიციონერის გავლენას აქარვებს." },
      { q: "ცივი მილი ცივია, მაგრამ მაინც ცუდად აცივებს",
        a: "შეამოწმეთ გარე ბლოკი — შესაძლოა გადახურდა. თუ ბლოკი ცხელია (60°C-ზე მეტი), ვენტილატორი ცუდად მუშაობს ან გრილების სისტემაა გადატვირთული. ხელით შეამოწმეთ, ბრუნავს თუ არა ვენტილატორი." },
      { q: "საერთოდ აღარ მუშაობს",

    ];

      <>
        <Nav active="გზამკვლევები"/>

        <main>
          <div className="kg-article">
            <ArticleHeader
              crumbs={[
                { label: "მთავარი", href: "index.html" },
                { label: "გზამკვლევები", href: "guides.html" },
                { label: "არ აცივებს" },
              ]}
              title="კონდიციონერი არ აცივებს — რა ვქნათ?"

            <TLDR items={tldr}/>

            <section style={{ paddingTop: 48 }}>
              <h2>1. დაბინძურებული ფილტრი (ყველაზე ხშირი)</h2>
              <p>გრილების სიმძლავრე ხშირად 30-50%-ით ეცემა მხოლოდ ფილტრის დაბინძურების გამო. შემოწმება:</p>
              <ol style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გახსენით შიდა ბლოკის წინა პანელი (ჩვეულებრივ ზემოდან აქვს სახელური)</li>
                <li>ამოიღეთ ფილტრი (ბადისებური ფირფიტა)</li>
                <li>თუ რუხია ან მტვრიანი, გასუფთავეთ წყლით ან მტვერსასრუტით</li>
                <li>გააშრეთ ჰაერზე — არ მოათავსოთ პირდაპირ მზის ქვეშ</li>
                <li>დააბრუნეთ ფილტრი თავის ადგილზე</li>
              </ol>
              <p>გაწმენდის რეგულარულობა — 4-6 კვირაში ერთხელ.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>2. ფრიონის გაჟონვა</h2>
              <p>კონდიციონერი მუშაობს, ვენტილატორი ბრუნავს, მაგრამ ცივი ჰაერი არ მოდის — ეს ფრიონის გაჟონვის ნიშანია. შესამოწმებლები:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გარე ბლოკთან მისული თხელი მილი — თუ მასზე თეთრი ყინულის ფენაა, ფრიონის წნევა დაბალია</li>
                <li>ხანგრძლივი მუშაობის შემდეგ წყლის წვეთები მონტაჟის ხვრელიდან</li>
                <li>კონდიციონერი თვითონ ხშირად გამოირთვება დაცვის რეჟიმში გადასვლის გამო</li>
              </ul>
              <p>გადაჭრა: ტექნიკოსმა უნდა იპოვოს გაჟონვის ადგილი, აღმოფხვრას იგი და მხოლოდ შემდეგ ჩატენოს ფრიონი — სრული მომსახურება 150-250 ლარი. უბრალო ფრიონის ჩატენა გაჟონვის აღმოფხვრის გარეშე 6-12 თვეში ისევ ცარიელდება.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>3. გადახურებული გარე ბლოკი</h2>
              <p>ცხელ დღეს გარე ბლოკი, რომელიც პირდაპირ მზის ქვეშ ან გავარვარებულ ფასადზე დგას, გადახურდება. დაცვის სისტემა ან ხურავს მუშაობას ან მინიმუმ სიმძლავრეზე გადადის. ნიშნები:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გარე ბლოკის კორპუსი იმდენად ცხელია, რომ ხელით ვერ შეეხებით</li>
                <li>ვენტილატორი არ ბრუნავს ან ნელა ბრუნავს</li>
                <li>ცხელ საათებში პრობლემა მძიმდება, საღამოს კი ცოტა უმჯობესდება</li>
              </ul>
              <p>დროებითი გადაჭრა — ცივი წყლის შესხურება გარე ბლოკის კორპუსზე (გრილებს გარეგნულად). გრძელვადიანი — გარე ბლოკის გადატანა ჩრდილოვან ადგილზე ან მზის დამცავის (sun shade) დაყენება.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>4. არასწორად შერჩეული სიმძლავრე</h2>
              <p>თუ 9000 BTU მოდელი (25 კვ.მ-მდე გათვლილი) დიდ, 35-40 კვ.მ ოთახშია დაყენებული, ცივი ჰაერი უბრალოდ ვერ ჰყოფნის სივრცეს. შემოწმება:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გადაზომეთ ოთახის ფართობი (სიგრძე × სიგანე)</li>
                <li>გადაამოწმეთ საჭირო BTU ჩვენი <a href="btu.html">BTU კალკულატორით</a></li>
                <li>თუ კონდიციონერი 30%-ით ნაკლები სიმძლავრისაა — ერთადერთი გამოსავალია მისი შეცვლა ან მეორე მოწყობილობის დამატება</li>
              </ul>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>5. სითბური წყაროები ოთახში</h2>
              <p>კონდიციონერი მუშაობს კარგად, BTU სწორად შერჩეული, ფილტრი სუფთა — მაგრამ ოთახი მაინც ცხელია. ხშირი მიზეზი — სითბური წყაროები ოთახის შიგნით:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>გაღებული კარი ან ფანჯარა — გრილი ჰაერი გადის გარეთ</li>
                <li>კომპიუტერი ან სხვა ტექნიკა (გასცემს 200-400 ვტ სითბოს)</li>
                <li>პირდაპირი მზე ფანჯრიდან (განსაკუთრებით სამხრეთის ფასადზე)</li>
                <li>ბევრი ხალხი ერთად (1 ადამიანი — დაახლოებით 100 ვტ სითბო)</li>
                <li>გახსნილი სამზარეულო — გაზის ქურა ან ღუმელი მნიშვნელოვან სითბოს უმატებს</li>
              </ul>
              <p>გადაჭრა: ფარდები სამხრეთის ფანჯრებზე, კარები დახურული, კონდიციონერი დადგით იმ ოთახში, სადაც დიდხანს ხართ.</p>
            </section>

            <section style={{ paddingTop: 32 }}>
              <h2>როდის გამოვიძახოთ ტექნიკოსი</h2>
              <p>თვითონ შემოწმების შემდეგ, თუ:</p>
              <ul style={{ fontSize: 17, lineHeight: 1.85, paddingLeft: 24 }}>
                <li>ფილტრი სუფთაა, ფანჯრები დახურულია, BTU სწორად შერჩეული — მაგრამ მაინც ცუდად აცივებს</li>
                <li>ცივი მილი ყინულითაა დაფარული (ფრიონის გაჟონვა)</li>
                <li>გარე ბლოკი არ ბრუნავს ან ცხელია</li>
                <li>კონდიციონერი თვითონ გამოირთვება ან საერთოდ აღარ ირთვება</li>
              </ul>
              <p>დიაგნოსტიკის ფასი — 80-120 ლარი. ეს არ მოიცავს რემონტს, მხოლოდ პრობლემის გამოვლენას. რეკომენდირებულია ბრენდის სერტიფიცირებული ტექნიკოსი.</p>
            </section>

            <section style={{ paddingTop: 48 }}>
              <FAQ items={faqs}/>
            </section>

            <div style={{ marginTop: 64 }}>
              <AuthorBio
                initials="ნჯ"
                name="ნიკა ჯავახიშვილი"
                role="მთავარი რედაქტორი · 6 წლის გამოცდილება კონდიციონერების ანალიზში"
                bio="ვტესტავ კონდიციონერებს რეალურ ბინებში თბილისში. ჩემი მიზანია, ყოველი რეკომენდაცია გამოცდილებას ემყარებოდეს და არა მწარმოებლის მარკეტინგულ მასალას."
              />
            </div>
          </div>
        </main>

        <Footer/>
      </>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
